<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./css/estilos-formularios.css">
</head>
<body>
  <form class="flat-form">
  <div class="form-group">
    <label for="nombre">Nombre Completo</label>
    <input type="text" id="nombre" class="flat-input" placeholder="Ej. Juan Pérez">
  </div>

  <div class="form-group">
    <label for="pais">País de Residencia</label>
    <select id="pais" class="flat-select">
      <option value="" disabled selected>Selecciona una opción</option>
      <option value="mx">México</option>
      <option value="co">Colombia</option>
      <option value="es">España</option>
      <option value="ar">Argentina</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="button" class="flat-btn flat-btn-secondary">Cancelar</button>
    <button type="submit" class="flat-btn flat-btn-primary">Enviar</button>
  </div>
</form>
</body>
</html>
